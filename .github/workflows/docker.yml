# Goal: To build and push the docker images

name: Docker Build & Push

on:
  workflow_call:
  workflow_dispatch:
    
permissions:
  contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Docker setup
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                push: true
                tags: "${{ vars.DOCKER_USERNAME }}/e-commerce-python:latest"
                load: true

            - name: Scan Docker Image for Vulnerabilities
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: '${{ vars.DOCKER_USERNAME }}/e-commerce-python:latest'
                format: 'table'
                exit-code: '1'
                severity: 'CRITICAL'
