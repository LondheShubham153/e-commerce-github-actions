# Goal is to call the workflows in the order to implement shift left

name: DevSecOps 

on:
    push:

jobs:
    # Secrets Scan
    secret-scan:
        uses: ./.github/workflows/secrets-scanning.yml
        secrets: inherit

    # Code
    code:
        needs: secret-scan
        uses: ./.github/workflows/lint_and_test.yml
    
    # SAST
    sast:
        needs: code
        uses: ./.github/workflows/sonar_scan.yml
        secrets: inherit

    # Dependency Scan
    dependency-scan:
        needs: sast
        uses: ./.github/workflows/dependency_scan.yml

    # Build & Scan
    build-and-scan:
        secrets: inherit
        needs: dependency-scan
        uses: ./.github/workflows/trivy_scans.yml
    
    # Deploy
    # deploy:
