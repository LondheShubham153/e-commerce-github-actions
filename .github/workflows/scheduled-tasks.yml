# Goal: Run scheduled tasks using cron expressions and manually via workflow_dispatch.

name: Scheduled health check 

on:
  schedule:
    - cron: '30 2 * * 1' # Runs every monday at 2:30 AM UTC
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows us to run it manually right now!
  
jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Print Trigger Info
        run: |
          echo "Event name: ${{ github.event.schedule }}"
          echo "Triggered by scheduled: ${{ github.event.schedule || 'Manual Trigger' }}"

      - name: Perform Website Health Check
        run: |
          echo "Checking health of Github..."
          # curl command to get only the HTTP status code
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://github.com)

          echo "HTTP status code recieved: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health check passed! The site is up."
          else
            echo "::error:: Health check failed with status $HTTP_STATUS"
            exit 1
          fi

