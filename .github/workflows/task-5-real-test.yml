# Goal: Execute a real test script in CI and observe Red (Failure) to green (pass) behaviour.

name: Day 44 - Task 5 Real CI Test

on:
    push:
        paths:
            - 'tests/**'
            - '.github/workflows/task-5-real-test.yml'
    workflow_dispatch:

jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository code
              uses: actions/checkout@v7

            - name: Setup python environment
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: Execute python unit test
              run: |
                python tests/math_operations.py
                