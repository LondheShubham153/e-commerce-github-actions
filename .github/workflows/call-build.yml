# Goal: A caller workflow that triggers on a push to the main branch.

name: Call reusable workflow

on:
    #push:
        #branches:
           # - main
    workflow_dispatch: 

jobs:
    call-reusable-build:
        uses: ./.github/workflows/reusable-build.yml
        with:
            app_name: "my-web-app"
            environment: "production"
        secrets:
            docker_token: ${{ secrets.DOCKER_TOKEN }}

    print-output:
        runs-on: ubuntu-latest
        needs: call-reusable-build
        steps:
            - name: Print the build version from reusable workflow
              run: |
                echo "The build version is: ${{ needs.call-reusable-build.outputs.build_version }}"
                
