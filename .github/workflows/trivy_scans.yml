#Goal: To scan the built docker image before pushing

name: Image Scan

on:
    workflow_call:

jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Docker setup
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                push: false
                tags: "${{ vars.DOCKER_USERNAME }}/e-commerce-python:latest"
                load: true

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: "${{ vars.DOCKER_USERNAME }}/e-commerce-python:latest"
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'