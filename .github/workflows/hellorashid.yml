# GOAL: Execute the first basic GitHub Actions pipeline to verify CI setup
# TRIGGER: Executes automatically on every push to any branch

name: Hello Workflow

on:
  # push:
  
  workflow_dispatch:
    
jobs:
  # JOB 1: Inspect the underlying runner OS, branch context, and filesystem
  greet:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code onto the runner's workspace
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Execute a basic shell command to verify the runner is active
      - name: Print Greeting
        run: echo "Hello from GitHub Actions!"

      # New Step: Print system date and time
      - name: Print system date and time
        run: date

      # New Step: Inject GitHub context variable to find branch name
      - name: Print Branch Name
        run: echo "Triggered branch is ${{ github.ref_name }}"

      # New Step: List all files downloaded by the checkout action
      - name: List Files in Repo
        run: ls -la

      # New Step: Print the exact Operating System of the runner
      - name: Print Runner OS
        run: echo "The runner OS is ${{ runner.os }}"

      # INTENTIONAL FAILURE: Test how GitHub Actions handles exit codes
      - name: Break the Pipeline 
        run: echo "This is a typo and will crash the pipeline"
